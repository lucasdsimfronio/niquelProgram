<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Níkel</title>
</head>
<body id="login">
    <main>
        
        <div class="container">
            <div class="row vh-100 align-items-center">
                <div class="col d-flex justify-content-center flex-column">
                    <div class="text-login">
                        <p>Organize suas finanças de uma forma fácil</p>
                        <p>Controle seu dinheiro e seus investimentos</p>
                        <p>Economize e atinja seus objetivos</p>
                    </div>
                    <div class="text-center">
                        <img class="img-fluid" src="./assets/imgs/images/pocket.png" alt="pocket image">
                        <img class="img-fluid d-none d-md-inline coins" src="./assets/imgs/images/coins.png" alt="coins image">
                    </div>
                </div>
                <div class="col">
                    <div class="container">
                        <div class="row">
                            <div class="col">
                                <div class="text-center mb-3">
                                    <img class="img-fluid" src="./assets/imgs/images/nikel-logo.png" alt="nikel logo">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <form id="login-form">
                                    <div class="mb-3">
                                        <label for="email-input" class="form-label">Endereço de e-mail</label>
                                        <input type="email" class="form-control" id="email-input" aria-describedby="login-email-help" required>
                                        <div id="login-email-help" class="form-text">Utilize seu e-mail para realizar seu login</div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password-input" class="form-label">Senha</label>
                                        <input type="password" class="form-control" id="password-input" required>
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="session-check-login">
                                        <label class="form-check-label" for="session-check-login">Permanecer logado</label>
                                    </div>
                                    <button type="submit" class="btn button-login">Entrar</button>
                                </form>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p id="link-conta" class="text-center mt-2 form-text" data-bs-toggle="modal" data-bs-target="#register-modal">
                                    Ainda não tem conta? <span class="link-default">Criar uma conta.</span>
                                </p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="text-center mt-5">
                                    <img src="./assets/imgs/images/codai-logo.png" alt="codai logo">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="text-center">
                                    <img src="./assets/imgs/images/growdev-logo.png" alt="growdev logo">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="modal fade" id="register-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Crie sua conta</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="create-form">
                        <div class="modal-body">                            
                            <div class="mb-3">
                                <label for="email-create-input" class="form-label">
                                    Endereço de e-mail
                                </label>
                                <input type="email" class="form-control" id="email-create-input" aria-describedby="create-email-help" required>
                                <div id="create-email-help" class="form-text">
                                    Utilize seu e-mail para criar sua senha
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password-create-input" class="form-label">
                                    Senha
                                </label>
                                <input type="password" class="form-control" id="password-create-input" required>
                            </div>
                            <div class="form-text">
                                    Utilize uma senha que você irá lembrar
                            </div>   
                            <div class="mb-3 form-check">
                                <input class="form-check-input" type="checkbox" value="" id="session-check">
                                <label class="form-check-label" for="session-check">
                                    Permanecer logado
                                </label>
                            </div>                         
                            <div class="mb-3">
                                <label for="confirm-password-input" class="form-label">
                                    Confirmar senha
                                </label>
                                <input type="password" class="form-control" id="confirm-password-input" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary button-cancel" data-bs-dismiss="modal">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-primary button-default">
                                Criar conta
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/index.js"></script>
</body>
</html>
